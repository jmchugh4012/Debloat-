<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JMbets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23131614'/%3E%3Ctext x='16' y='22' font-family='Arial Narrow,Arial,sans-serif' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3EJM%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* Layout: a betting ledger. Summary strip, open slips, chart + splits, then the full ledger. */
      :root {
        --bg: #f3f4f2;
        --surface: #ffffff;
        --surface-2: #f1f2ef;
        --border: #e1e3df;
        --rule: #cfd2cc;
        --text: #131614;
        --muted: #686e69;
        --accent: #131614;
        --accent-text: #ffffff;
        --win: #157347;
        --win-bg: #e3f2ea;
        --loss: #c0352b;
        --loss-bg: #fbe7e5;
        --push: #727872;
        --push-bg: #ecedea;
        --pending: #a46207;
        --pending-bg: #fbf0dc;
        --cash: #5b4bb5;
        --cash-bg: #ece9f8;
        --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
        --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
        --radius: 10px;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1110;
          --surface: #161917;
          --surface-2: #1d201e;
          --border: #272b28;
          --rule: #353a36;
          --text: #e9ece9;
          --muted: #8d948e;
          --accent: #e9ece9;
          --accent-text: #0f1110;
          --win: #4cc38a;
          --win-bg: #15291f;
          --loss: #f0695e;
          --loss-bg: #331a18;
          --push: #9aa19b;
          --push-bg: #222624;
          --pending: #e0a43a;
          --pending-bg: #30260f;
          --cash: #a497f0;
          --cash-bg: #24203b;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f1110;
        --surface: #161917;
        --surface-2: #1d201e;
        --border: #272b28;
        --rule: #353a36;
        --text: #e9ece9;
        --muted: #8d948e;
        --accent: #e9ece9;
        --accent-text: #0f1110;
        --win: #4cc38a;
        --win-bg: #15291f;
        --loss: #f0695e;
        --loss-bg: #331a18;
        --push: #9aa19b;
        --push-bg: #222624;
        --pending: #e0a43a;
        --pending-bg: #30260f;
        --cash: #a497f0;
        --cash-bg: #24203b;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 16px 64px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .wordmark {
        font-family: var(--font-display);
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.01em;
        line-height: 1;
        margin: 0;
        text-transform: uppercase;
      }
      .wordmark .jm {
        background: var(--text);
        color: var(--bg);
        padding: 0 5px;
        margin-right: 2px;
        border-radius: 3px;
      }
      .tagline {
        font-size: 13px;
        color: var(--muted);
      }
      h2,
      .section-title {
        font-family: var(--font-display);
        font-size: 15px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 0 0 12px;
        text-wrap: balance;
      }
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        min-width: 0;
      }
      button,
      .btn {
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid var(--rule);
        background: transparent;
        color: var(--text);
        border-radius: 6px;
        padding: 7px 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        background: var(--surface-2);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }
      button.primary:hover {
        opacity: 0.88;
        background: var(--accent);
      }
      button.small {
        padding: 3px 8px;
        font-size: 12px;
      }
      button.danger {
        color: var(--loss);
      }
      input,
      select,
      textarea {
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 8px 10px;
        width: 100%;
        min-width: 0;
      }
      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 1px;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
        margin-bottom: 4px;
      }

      /* summary strip */
      .stats {
        display: grid;
        grid-template-columns: 1.4fr repeat(5, 1fr);
        padding: 0;
        margin-bottom: 20px;
      }
      .stat {
        padding: 16px 18px;
        border-left: 1px solid var(--border);
        min-width: 0;
      }
      .stat:first-child {
        border-left: none;
      }
      .stat .label {
        font-size: 12px;
        color: var(--muted);
      }
      .stat .value {
        font-family: var(--font-display);
        font-size: 30px;
        font-weight: 600;
        line-height: 1.1;
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
      }
      .stat:first-child .value {
        font-size: 40px;
      }
      .stat .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      @media (max-width: 900px) {
        .stats {
          grid-template-columns: repeat(3, 1fr);
        }
        .stat:nth-child(4) {
          border-left: none;
        }
        .stat:nth-child(n + 4) {
          border-top: 1px solid var(--border);
        }
      }
      @media (max-width: 520px) {
        .stats {
          grid-template-columns: 1fr 1fr;
        }
        .stat:first-child {
          grid-column: 1 / -1;
        }
        .stat {
          border-left: none;
          border-top: 1px solid var(--border);
        }
        .stat:first-child {
          border-top: none;
        }
        .stat:nth-child(odd):not(:first-child) {
          border-left: 1px solid var(--border);
        }
        .stat:last-child:nth-child(even) {
          grid-column: 1 / -1;
        }
      }
      .pos {
        color: var(--win);
      }
      .neg {
        color: var(--loss);
      }

      .grid2 {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      @media (max-width: 860px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
      }

      #chart {
        width: 100%;
        height: 220px;
        display: block;
      }
      .chart-empty {
        height: 220px;
        display: grid;
        place-items: center;
        color: var(--muted);
      }

      .tabs {
        display: flex;
        gap: 16px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }
      .tabs button {
        border: none;
        border-radius: 0;
        background: none;
        padding: 6px 0 8px;
        font-size: 13px;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tabs button[aria-selected="true"] {
        color: var(--text);
        font-weight: 600;
        border-bottom-color: var(--text);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      th {
        font-size: 11px;
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        white-space: nowrap;
        border-bottom-color: var(--rule);
      }
      th.sortable {
        cursor: pointer;
        user-select: none;
      }
      th.sortable:hover {
        color: var(--text);
      }
      td.num,
      th.num {
        text-align: right;
      }
      td.odds {
        font-family: var(--font-mono);
        font-size: 13px;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .table-scroll {
        overflow-x: auto;
      }
      .ledger {
        min-width: 680px;
      }
      .event {
        font-weight: 600;
      }
      .event-sub {
        font-size: 12px;
        color: var(--muted);
      }
      .event-note {
        font-size: 12px;
        color: var(--muted);
        font-style: italic;
      }

      /* result marks: colored text with a small square, no bubbles */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      .pill::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 2px;
        background: currentColor;
      }
      .pill.won {
        color: var(--win);
      }
      .pill.lost {
        color: var(--loss);
      }
      .pill.push,
      .pill.void {
        color: var(--push);
      }
      .pill.pending {
        color: var(--pending);
      }
      .pill.cashout {
        color: var(--cash);
      }

      .filters {
        display: grid;
        grid-template-columns: 2fr repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 8px;
      }
      @media (max-width: 760px) {
        .filters {
          grid-template-columns: 1fr 1fr;
        }
        .filters .search {
          grid-column: 1 / -1;
        }
      }

      .actions {
        display: flex;
        gap: 4px;
        justify-content: flex-end;
      }
      .empty {
        text-align: center;
        padding: 40px 10px;
        color: var(--muted);
      }

      dialog {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--text);
        padding: 0;
        width: min(620px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
      }
      dialog::backdrop {
        background: rgba(10, 12, 11, 0.5);
      }
      .dlg-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
      }
      .dlg-head h2 {
        margin: 0;
      }
      .dlg-head button {
        border: none;
      }
      .dlg-body {
        padding: 18px 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .dlg-body .full {
        grid-column: 1 / -1;
      }
      @media (max-width: 520px) {
        .dlg-body {
          grid-template-columns: 1fr;
        }
      }
      .dlg-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 12px 20px;
        border-top: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .preview {
        font-size: 13px;
        color: var(--muted);
      }
      .preview b {
        color: var(--text);
        font-family: var(--font-mono);
        font-weight: 500;
      }
      .hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
        font-family: var(--font-mono);
      }
      .hidden {
        display: none !important;
      }
      .toast {
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        background: var(--text);
        color: var(--bg);
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .toast {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <h1 class="wordmark"><span class="jm">JM</span>bets</h1>
          <span class="tagline">Picks &amp; results</span>
        </div>
        <div class="row">
          <button id="themeBtn">Dark mode</button>
          <button id="exportCsvBtn">Export CSV</button>
          <button id="exportJsonBtn">Backup</button>
          <button id="importBtn">Restore</button>
          <input
            id="importFile"
            type="file"
            accept=".json,application/json"
            class="hidden"
          />
          <button id="addBtn" class="primary">+ Add bet</button>
        </div>
      </header>

      <section class="card stats" id="stats"></section>

      <section class="grid2">
        <div class="card">
          <div
            class="row"
            style="justify-content: space-between; margin-bottom: 8px"
          >
            <h2 style="margin: 0">Profit over time</h2>
            <div class="row">
              <label for="bankroll" style="margin: 0">Starting bankroll</label>
              <input
                id="bankroll"
                type="number"
                min="0"
                step="any"
                placeholder="0"
                style="width: 110px"
              />
            </div>
          </div>
          <div id="chartWrap"></div>
        </div>
        <div class="card">
          <div class="tabs" role="tablist" id="breakdownTabs">
            <button role="tab" data-key="sport" aria-selected="true">
              Sport
            </button>
            <button role="tab" data-key="book" aria-selected="false">
              Sportsbook
            </button>
            <button role="tab" data-key="type" aria-selected="false">
              Bet
            </button>
          </div>
          <div class="table-scroll" id="breakdown"></div>
        </div>
      </section>

      <section class="card">
        <div class="filters">
          <input
            class="search"
            id="fSearch"
            type="search"
            placeholder="Search event, pick, notes…"
          />
          <select id="fStatus">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="won">Won</option>
            <option value="lost">Lost</option>
            <option value="push">Push</option>
            <option value="void">Void</option>
            <option value="cashout">Cashed out</option>
          </select>
          <select id="fSport"></select>
          <select id="fBook"></select>
          <select id="fRange">
            <option value="">All time</option>
            <option value="7">Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="ytd">This year</option>
          </select>
        </div>
        <div class="table-scroll">
          <table class="ledger">
            <thead>
              <tr>
                <th class="sortable" data-sort="date">Date</th>
                <th class="sortable" data-sort="event">Event / Pick</th>
                <th class="sortable" data-sort="sport">Sport</th>
                <th class="sortable num" data-sort="odds">Odds</th>
                <th class="sortable num" data-sort="stake">Stake</th>
                <th class="sortable" data-sort="status">Result</th>
                <th class="sortable num" data-sort="profit">P/L</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty hidden"></div>
      </section>
    </div>

    <dialog id="dlg">
      <form id="betForm" method="dialog">
        <div class="dlg-head">
          <h2 id="dlgTitle">Add bet</h2>
          <button type="button" id="closeDlg" aria-label="Close">✕</button>
        </div>
        <div class="dlg-body">
          <div>
            <label for="bDate">Date</label>
            <input id="bDate" type="date" required />
          </div>
          <div>
            <label for="bSport">Sport / League</label>
            <select id="bSport"></select>
          </div>
          <div class="full">
            <label for="bEvent">Event</label>
            <input
              id="bEvent"
              placeholder="e.g. Chiefs vs Bills"
              required
              autocomplete="off"
            />
          </div>
          <div>
            <label for="bType">Bet</label>
            <select id="bType"></select>
          </div>
          <div>
            <label for="bBook">Sportsbook</label>
            <input
              id="bBook"
              list="bookList"
              placeholder="DraftKings, FanDuel…"
            />
            <datalist id="bookList"></datalist>
          </div>
          <div class="full" id="playerWrap">
            <label for="bPlayer">Player</label>
            <input
              id="bPlayer"
              list="playerList"
              placeholder="e.g. Patrick Mahomes"
              autocomplete="off"
            />
            <datalist id="playerList"></datalist>
          </div>
          <div id="sideWrap">
            <label for="bSide">Side</label>
            <select id="bSide"></select>
          </div>
          <div id="lineWrap">
            <label for="bLine" id="lineLabel">Line</label>
            <input
              id="bLine"
              type="number"
              step="any"
              placeholder="e.g. 274.5"
            />
          </div>
          <div class="full">
            <label for="bPick" id="pickLabel">Pick / Selection</label>
            <input id="bPick" autocomplete="off" />
          </div>
          <div>
            <label for="bOdds">Odds</label>
            <input
              id="bOdds"
              placeholder="-110, +150 or 2.50"
              required
              autocomplete="off"
            />
            <div class="hint" id="oddsHint">American or decimal</div>
          </div>
          <div>
            <label for="bStake">Stake</label>
            <input id="bStake" type="number" min="0" step="any" required />
          </div>
          <div>
            <label for="bStatus">Result</label>
            <select id="bStatus">
              <option value="pending">Pending</option>
              <option value="won">Won</option>
              <option value="lost">Lost</option>
              <option value="push">Push</option>
              <option value="void">Void</option>
              <option value="cashout">Cashed out</option>
            </select>
          </div>
          <div id="cashoutWrap" class="hidden">
            <label for="bCashout">Cash-out amount received</label>
            <input id="bCashout" type="number" min="0" step="any" />
          </div>
          <div class="full">
            <label for="bNotes">Notes</label>
            <textarea id="bNotes" rows="2"></textarea>
          </div>
        </div>
        <div class="dlg-foot">
          <div class="preview" id="preview"></div>
          <div class="row">
            <button type="button" id="cancelDlg">Cancel</button>
            <button type="submit" class="primary" id="saveBtn">Save bet</button>
          </div>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast"></div>

    <script>
      (function () {
        "use strict";

        const STORE_KEY = "betTracker.v1";
        const $ = (id) => document.getElementById(id);

        // ---------- storage ----------
        function load() {
          try {
            const raw = localStorage.getItem(STORE_KEY);
            if (raw) {
              const d = JSON.parse(raw);
              return {
                bets: Array.isArray(d.bets) ? d.bets : [],
                bankroll: Number(d.bankroll) || 0,
                theme: d.theme || "",
              };
            }
          } catch (e) {}
          return { bets: [], bankroll: 0, theme: "" };
        }
        let state = load();
        function save() {
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(state));
          } catch (e) {
            toast("Couldn't save — browser storage is unavailable");
          }
        }

        // ---------- odds & money ----------
        function parseOdds(input) {
          const s = String(input).trim().replace(/\s/g, "");
          if (!s) return null;
          const n = Number(s);
          if (!isFinite(n)) return null;
          const american = /^[+-]/.test(s) || Math.abs(n) >= 100;
          if (american) {
            if (Math.abs(n) < 100) return null;
            return n > 0 ? 1 + n / 100 : 1 + 100 / Math.abs(n);
          }
          return n > 1 ? n : null;
        }
        function toAmerican(dec) {
          if (!dec || dec <= 1) return "—";
          if (dec >= 2) return "+" + Math.round((dec - 1) * 100);
          return String(Math.round(-100 / (dec - 1)));
        }
        function profitOf(b) {
          switch (b.status) {
            case "won":
              return b.stake * (b.odds - 1);
            case "lost":
              return -b.stake;
            case "cashout":
              return (Number(b.cashout) || 0) - b.stake;
            default:
              return 0;
          }
        }
        const isSettled = (b) => b.status !== "pending";
        const fmtMoney = (n) =>
          (n < 0 ? "-$" : "$") +
          Math.abs(n).toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          });
        const fmtSigned = (n) =>
          (n > 0 ? "+" : "") + fmtMoney(n).replace("-$", "−$");
        const fmtPct = (n) =>
          isFinite(n) ? (n > 0 ? "+" : "") + n.toFixed(1) + "%" : "—";
        const cls = (n) => (n > 0.004 ? "pos" : n < -0.004 ? "neg" : "");
        const esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const todayStr = () => {
          const d = new Date();
          d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
          return d.toISOString().slice(0, 10);
        };
        const fmtDate = (s) => {
          const [y, m, d] = s.split("-").map(Number);
          return new Date(y, m - 1, d).toLocaleDateString(undefined, {
            month: "short",
            day: "numeric",
            year: "2-digit",
          });
        };
        const uid = () =>
          Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

        // ---------- sports & markets ----------
        // Each market: [name, kind]. Kinds: ml (pick a side), spread (team +
        // line), total (over/under + line), ou (player over/under + line),
        // yn (player yes/no), pick (free selection).
        const LINES = {
          football: [
            ["Moneyline", "ml"],
            ["Spread", "spread"],
            ["Total Points", "total"],
            ["Team Total", "total"],
            ["1st Half Moneyline", "ml"],
            ["1st Half Spread", "spread"],
            ["1st Half Total", "total"],
            ["1st Quarter Spread", "spread"],
            ["1st Quarter Total", "total"],
          ],
          basketball: [
            ["Moneyline", "ml"],
            ["Spread", "spread"],
            ["Total Points", "total"],
            ["Team Total", "total"],
            ["1st Half Moneyline", "ml"],
            ["1st Half Spread", "spread"],
            ["1st Half Total", "total"],
            ["1st Quarter Spread", "spread"],
            ["1st Quarter Total", "total"],
          ],
          baseball: [
            ["Moneyline", "ml"],
            ["Run Line", "spread"],
            ["Total Runs", "total"],
            ["Team Total Runs", "total"],
            ["1st 5 Innings Moneyline", "ml"],
            ["1st 5 Innings Run Line", "spread"],
            ["1st 5 Innings Total", "total"],
            ["No Run 1st Inning (NRFI)", "pick"],
            ["Yes Run 1st Inning (YRFI)", "pick"],
          ],
          hockey: [
            ["Moneyline", "ml"],
            ["Puck Line", "spread"],
            ["Total Goals", "total"],
            ["Team Total Goals", "total"],
            ["60-Minute Line (3-Way)", "ml"],
            ["1st Period Moneyline", "ml"],
            ["1st Period Total", "total"],
          ],
          soccer: [
            ["Moneyline (3-Way)", "ml"],
            ["Double Chance", "pick"],
            ["Draw No Bet", "ml"],
            ["Asian Handicap", "spread"],
            ["Total Goals", "total"],
            ["Team Total Goals", "total"],
            ["Both Teams To Score", "pick"],
            ["Correct Score", "pick"],
            ["Total Corners", "total"],
            ["Total Cards", "total"],
          ],
          tennis: [
            ["Match Winner", "ml"],
            ["Set Spread", "spread"],
            ["Game Spread", "spread"],
            ["Total Games", "total"],
            ["Total Sets", "total"],
            ["Set Betting (Correct Score)", "pick"],
            ["1st Set Winner", "ml"],
          ],
          mma: [
            ["Moneyline", "ml"],
            ["Method of Victory", "pick"],
            ["Round Betting", "pick"],
            ["Total Rounds", "total"],
            ["Goes the Distance", "pick"],
          ],
          golf: [
            ["Outright Winner", "pick"],
            ["Top 5 Finish", "pick"],
            ["Top 10 Finish", "pick"],
            ["Top 20 Finish", "pick"],
            ["Make / Miss Cut", "pick"],
            ["Head-to-Head Matchup", "pick"],
            ["First Round Leader", "pick"],
            ["Round Score", "total"],
          ],
          other: [
            ["Moneyline", "ml"],
            ["Spread", "spread"],
            ["Total", "total"],
          ],
        };
        const ou = (names) => names.map((n) => [n, "ou"]);
        const yn = (names) => names.map((n) => [n, "yn"]);
        const PROPS = {
          football: [
            ...ou([
              "Passing Yards",
              "Passing TDs",
              "Pass Completions",
              "Pass Attempts",
              "Interceptions Thrown",
              "Longest Completion",
              "Rushing Yards",
              "Rushing Attempts",
              "Longest Rush",
              "Receiving Yards",
              "Receptions",
              "Longest Reception",
              "Rush + Rec Yards",
              "Pass + Rush Yards",
              "Sacks",
              "Tackles + Assists",
              "Field Goals Made",
              "Kicking Points",
            ]),
            ...yn(["Anytime TD", "First TD", "2+ TDs", "Last TD"]),
          ],
          basketball: [
            ...ou([
              "Points",
              "Rebounds",
              "Assists",
              "3-Pointers Made",
              "Steals",
              "Blocks",
              "Turnovers",
              "Pts + Reb + Ast",
              "Pts + Reb",
              "Pts + Ast",
              "Reb + Ast",
              "Steals + Blocks",
            ]),
            ...yn(["Double-Double", "Triple-Double", "First Basket"]),
          ],
          baseball: [
            ...ou([
              "Hits",
              "Total Bases",
              "RBIs",
              "Runs Scored",
              "Hits + Runs + RBIs",
              "Singles",
              "Doubles",
              "Stolen Bases",
              "Walks",
              "Batter Strikeouts",
              "Pitcher Strikeouts",
              "Pitching Outs",
              "Hits Allowed",
              "Earned Runs Allowed",
              "Walks Allowed",
            ]),
            ...yn(["Home Run", "Pitcher to Record Win"]),
          ],
          hockey: [
            ...ou([
              "Points",
              "Goals",
              "Assists",
              "Shots on Goal",
              "Saves",
              "Goals Against",
              "Power Play Points",
              "Blocked Shots",
              "Hits",
            ]),
            ...yn(["Anytime Goal Scorer", "First Goal Scorer", "Shutout"]),
          ],
          soccer: [
            ...ou(["Shots", "Shots on Target", "Saves", "Tackles", "Passes"]),
            ...yn([
              "Anytime Goalscorer",
              "First Goalscorer",
              "To Assist",
              "Score or Assist",
              "To Be Carded",
            ]),
          ],
          tennis: [...ou(["Aces", "Double Faults", "Games Won"])],
          mma: [
            ...ou(["Significant Strikes", "Takedowns"]),
            ...yn(["Win by KO/TKO", "Win by Submission", "Win by Decision"]),
          ],
          golf: [...ou(["Birdies", "Round Score"])],
          other: [...ou(["Player Prop"]), ...yn(["Player Yes/No Prop"])],
        };
        const MULTI = [
          ["Parlay", "pick"],
          ["Same Game Parlay", "pick"],
          ["Teaser", "pick"],
          ["Futures", "pick"],
          ["Live Bet", "pick"],
          ["Other", "pick"],
        ];
        const SPORTS = [
          ["NFL", "football"],
          ["NCAAF", "football"],
          ["NBA", "basketball"],
          ["WNBA", "basketball"],
          ["NCAAB", "basketball"],
          ["MLB", "baseball"],
          ["NHL", "hockey"],
          ["Soccer", "soccer"],
          ["Tennis", "tennis"],
          ["UFC/MMA", "mma"],
          ["Golf", "golf"],
          ["Other", "other"],
        ];
        function familyOf(sport) {
          const hit = SPORTS.find(
            ([n]) => n.toLowerCase() === String(sport || "").toLowerCase(),
          );
          return hit ? hit[1] : "other";
        }
        function marketsFor(sport) {
          const f = familyOf(sport);
          return [
            ["Game lines", LINES[f]],
            ["Player props", PROPS[f]],
            ["Parlays & other", MULTI],
          ];
        }
        function kindOf(sport, type) {
          for (const [, list] of marketsFor(sport)) {
            const m = list.find(([n]) => n === type);
            if (m) return m[1];
          }
          return "pick";
        }
        const fmtLine = (n) =>
          n == null || n === "" ? "" : (n > 0 ? "+" : "") + n;
        // One-line description of what was bet, e.g. "P. Mahomes Over 274.5 Passing Yards"
        function describe(b) {
          const kind = b.kind || kindOf(b.sport, b.type);
          const pick = b.pick || "";
          switch (kind) {
            case "ou":
              return [b.player, b.side, b.line, b.type]
                .filter((x) => x != null && x !== "")
                .join(" ");
            case "yn":
              return [b.player, b.side === "No" ? "No" : "", b.type]
                .filter(Boolean)
                .join(" ");
            case "total":
              return [b.type + ":", b.side, b.line, pick && "· " + pick]
                .filter((x) => x != null && x !== "")
                .join(" ");
            case "spread":
              return [pick, fmtLine(b.line), "(" + b.type + ")"]
                .filter(Boolean)
                .join(" ");
            case "ml":
              return [pick, "(" + b.type + ")"].filter(Boolean).join(" ");
            default:
              return [b.type, pick && "· " + pick].filter(Boolean).join(" ");
          }
        }

        // ---------- filters / sorting ----------
        let sortKey = "date";
        let sortDir = -1;
        let breakdownKey = "sport";

        function filtered() {
          const q = $("fSearch").value.trim().toLowerCase();
          const st = $("fStatus").value;
          const sp = $("fSport").value;
          const bk = $("fBook").value;
          const rg = $("fRange").value;
          let minDate = "";
          if (rg === "ytd") minDate = new Date().getFullYear() + "-01-01";
          else if (rg) {
            const d = new Date();
            d.setDate(d.getDate() - Number(rg));
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            minDate = d.toISOString().slice(0, 10);
          }
          return state.bets.filter((b) => {
            if (st && b.status !== st) return false;
            if (sp && (b.sport || "—") !== sp) return false;
            if (bk && (b.book || "—") !== bk) return false;
            if (minDate && b.date < minDate) return false;
            if (q) {
              const hay = [b.event, describe(b), b.notes, b.sport, b.book]
                .join(" ")
                .toLowerCase();
              if (!hay.includes(q)) return false;
            }
            return true;
          });
        }

        function sorted(list) {
          const val = (b) => {
            switch (sortKey) {
              case "profit":
                return profitOf(b);
              case "event":
                return (b.event || "").toLowerCase();
              case "sport":
                return (b.sport || "").toLowerCase();
              default:
                return b[sortKey];
            }
          };
          return [...list].sort((a, c) => {
            const x = val(a),
              y = val(c);
            if (x < y) return -sortDir;
            if (x > y) return sortDir;
            return (a.created || 0) < (c.created || 0) ? -sortDir : sortDir;
          });
        }

        // ---------- render ----------
        function summarize(list) {
          const settled = list.filter(isSettled);
          const graded = settled.filter(
            (b) => b.status !== "void" && b.status !== "push",
          );
          const won = settled.filter((b) => b.status === "won").length;
          const lost = settled.filter((b) => b.status === "lost").length;
          const pushes = settled.filter(
            (b) => b.status === "push" || b.status === "void",
          ).length;
          const staked = graded.reduce((s, b) => s + b.stake, 0);
          const profit = settled.reduce((s, b) => s + profitOf(b), 0);
          const pending = list.filter((b) => b.status === "pending");
          return {
            count: list.length,
            won,
            lost,
            pushes,
            staked,
            profit,
            roi: staked ? (profit / staked) * 100 : NaN,
            winRate: won + lost ? (won / (won + lost)) * 100 : NaN,
            pendingCount: pending.length,
            pendingStake: pending.reduce((s, b) => s + b.stake, 0),
            pendingToWin: pending.reduce(
              (s, b) => s + b.stake * (b.odds - 1),
              0,
            ),
            avgOdds: graded.length
              ? graded.reduce((s, b) => s + b.odds, 0) / graded.length
              : 0,
          };
        }

        function renderStats(list) {
          const s = summarize(list);
          const bankroll = state.bankroll;
          // streak over all settled bets (most recent first)
          const settled = list
            .filter(isSettled)
            .sort((a, b) =>
              a.date === b.date
                ? (b.created || 0) - (a.created || 0)
                : a.date < b.date
                  ? 1
                  : -1,
            )
            .filter((b) => b.status === "won" || b.status === "lost");
          let streak = "—";
          if (settled.length) {
            const first = settled[0].status;
            let n = 0;
            for (const b of settled) {
              if (b.status === first) n++;
              else break;
            }
            streak = (first === "won" ? "W" : "L") + n;
          }
          const tiles = [
            {
              label: "Profit / Loss",
              value: fmtSigned(s.profit),
              c: cls(s.profit),
              sub: bankroll
                ? "Bankroll " + fmtMoney(bankroll + s.profit)
                : s.count + " bets tracked",
            },
            {
              label: "ROI",
              value: fmtPct(s.roi),
              c: cls(s.roi),
              sub: fmtMoney(s.staked) + " staked (settled)",
            },
            {
              label: "Record",
              value: s.won + "-" + s.lost + (s.pushes ? "-" + s.pushes : ""),
              sub: "Win rate " + fmtPct(s.winRate).replace("+", ""),
            },
            {
              label: "Pending",
              value: s.pendingCount,
              sub: s.pendingCount
                ? fmtMoney(s.pendingStake) +
                  " at risk · to win " +
                  fmtMoney(s.pendingToWin)
                : "No open bets",
            },
            {
              label: "Avg odds",
              value: s.avgOdds ? toAmerican(s.avgOdds) : "—",
              sub: s.avgOdds
                ? s.avgOdds.toFixed(2) +
                  " dec · implied " +
                  (100 / s.avgOdds).toFixed(1) +
                  "%"
                : "",
            },
            { label: "Streak", value: streak, sub: "Wins/losses in a row" },
          ];
          $("stats").innerHTML = tiles
            .map(
              (t) =>
                `<div class="stat"><div class="label">${t.label}</div><div class="value ${t.c || ""}">${esc(t.value)}</div><div class="sub">${esc(t.sub)}</div></div>`,
            )
            .join("");
        }

        function renderChart(list) {
          const settled = list
            .filter(isSettled)
            .sort((a, b) =>
              a.date === b.date
                ? (a.created || 0) - (b.created || 0)
                : a.date < b.date
                  ? -1
                  : 1,
            );
          const wrap = $("chartWrap");
          if (settled.length < 1) {
            wrap.innerHTML =
              '<div class="chart-empty">Settle a bet to see your profit curve</div>';
            return;
          }
          const base = state.bankroll || 0;
          const pts = [{ y: base, b: null }];
          let run = base;
          for (const b of settled) {
            run += profitOf(b);
            pts.push({ y: run, b });
          }
          const W = 640,
            H = 220,
            padL = 56,
            padR = 12,
            padT = 12,
            padB = 24;
          let min = Math.min(...pts.map((p) => p.y)),
            max = Math.max(...pts.map((p) => p.y));
          if (min === max) {
            min -= 1;
            max += 1;
          }
          const span = max - min;
          min -= span * 0.08;
          max += span * 0.08;
          const x = (i) =>
            padL + (i / Math.max(1, pts.length - 1)) * (W - padL - padR);
          const y = (v) =>
            padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
          const css = getComputedStyle(document.documentElement);
          const border = css.getPropertyValue("--border").trim();
          const muted = css.getPropertyValue("--muted").trim();
          const last = pts[pts.length - 1].y;
          const lineColor =
            last >= base
              ? css.getPropertyValue("--win").trim()
              : css.getPropertyValue("--loss").trim();

          let grid = "";
          for (let i = 0; i <= 4; i++) {
            const v = min + ((max - min) * i) / 4;
            const yy = y(v);
            grid += `<line x1="${padL}" x2="${W - padR}" y1="${yy}" y2="${yy}" stroke="${border}" stroke-width="1"/>`;
            grid += `<text x="${padL - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${muted}">${esc(fmtMoney(v).replace(".00", ""))}</text>`;
          }
          const zeroY = y(base);
          const line = pts
            .map(
              (p, i) =>
                (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.y).toFixed(1),
            )
            .join(" ");
          const area =
            line +
            ` L${x(pts.length - 1).toFixed(1)} ${zeroY} L${x(0)} ${zeroY} Z`;
          const firstDate = settled[0].date,
            lastDate = settled[settled.length - 1].date;
          const dots =
            pts.length <= 60
              ? pts
                  .slice(1)
                  .map(
                    (p, i) =>
                      `<circle cx="${x(i + 1)}" cy="${y(p.y)}" r="${i === pts.length - 2 ? 4 : 2}" fill="${lineColor}"><title>${esc(fmtDate(p.b.date) + " · " + p.b.event + " · " + fmtSigned(profitOf(p.b)) + " → " + fmtMoney(p.y))}</title></circle>`,
                  )
                  .join("")
              : "";
          wrap.innerHTML = `<svg id="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cumulative profit chart">
            ${grid}
            <line x1="${padL}" x2="${W - padR}" y1="${zeroY}" y2="${zeroY}" stroke="${muted}" stroke-dasharray="3 3" stroke-width="1"/>
            <path d="${area}" fill="${lineColor}" opacity="0.07"/>
            <path d="${line}" fill="none" stroke="${lineColor}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
            ${dots}
            <text x="${padL}" y="${H - 6}" font-size="11" fill="${muted}">${esc(fmtDate(firstDate))}</text>
            <text x="${W - padR}" y="${H - 6}" font-size="11" fill="${muted}" text-anchor="end">${esc(fmtDate(lastDate))}</text>
          </svg>`;
        }

        function renderBreakdown(list) {
          const field = breakdownKey;
          const groups = new Map();
          for (const b of list) {
            const k = b[field] || "—";
            if (!groups.has(k)) groups.set(k, []);
            groups.get(k).push(b);
          }
          const rows = [...groups.entries()]
            .map(([k, bets]) => ({ k, s: summarize(bets) }))
            .sort((a, b) => b.s.profit - a.s.profit);
          if (!rows.length) {
            $("breakdown").innerHTML =
              '<div class="empty" style="padding:20px">No data yet</div>';
            return;
          }
          $("breakdown").innerHTML =
            `<table><thead><tr><th></th><th class="num">W-L</th><th class="num">P/L</th><th class="num">ROI</th></tr></thead><tbody>${rows
              .map(
                (r) =>
                  `<tr><td>${esc(r.k)}</td><td class="num">${r.s.won}-${r.s.lost}</td><td class="num ${cls(r.s.profit)}">${esc(fmtSigned(r.s.profit))}</td><td class="num ${cls(r.s.roi)}">${fmtPct(r.s.roi)}</td></tr>`,
              )
              .join("")}</tbody></table>`;
        }

        function renderRows(list) {
          const rows = sorted(list);
          const tbody = $("rows");
          const empty = $("emptyState");
          if (!rows.length) {
            tbody.innerHTML = "";
            empty.classList.remove("hidden");
            empty.innerHTML = state.bets.length
              ? "No bets match these filters."
              : "No bets yet. Click <b>+ Add bet</b> to log your first one.";
            return;
          }
          empty.classList.add("hidden");
          const labels = {
            pending: "Pending",
            won: "Won",
            lost: "Lost",
            push: "Push",
            void: "Void",
            cashout: "Cashed out",
          };
          tbody.innerHTML = rows
            .map((b) => {
              const p = profitOf(b);
              const pl =
                b.status === "pending"
                  ? `<span class="muted">to win ${esc(fmtMoney(b.stake * (b.odds - 1)))}</span>`
                  : `<span class="${cls(p)}">${esc(fmtSigned(p))}</span>`;
              const quick =
                b.status === "pending"
                  ? `<button class="small" data-act="won" data-id="${b.id}" title="Mark won">Won</button><button class="small" data-act="lost" data-id="${b.id}" title="Mark lost">Lost</button>`
                  : "";
              const sub = [describe(b), b.book].filter(Boolean).join(" · ");
              return `<tr>
                <td style="white-space:nowrap">${esc(fmtDate(b.date))}</td>
                <td><div class="event">${esc(b.event)}</div>${sub ? `<div class="event-sub">${esc(sub)}</div>` : ""}${b.notes ? `<div class="event-note" title="${esc(b.notes)}">${esc(b.notes.length > 60 ? b.notes.slice(0, 60) + "…" : b.notes)}</div>` : ""}</td>
                <td>${esc(b.sport || "—")}</td>
                <td class="num odds" title="${b.odds.toFixed(2)} decimal">${esc(b.oddsInput || toAmerican(b.odds))}</td>
                <td class="num">${esc(fmtMoney(b.stake))}</td>
                <td><span class="pill ${b.status}">${labels[b.status]}</span></td>
                <td class="num" style="white-space:nowrap">${pl}</td>
                <td><div class="actions">${quick}<button class="small" data-act="edit" data-id="${b.id}">Edit</button><button class="small danger" data-act="del" data-id="${b.id}" >Delete</button></div></td>
              </tr>`;
            })
            .join("");
        }

        function fillSelect(sel, values, allLabel) {
          const cur = sel.value;
          sel.innerHTML =
            `<option value="">${allLabel}</option>` +
            values
              .map((v) => `<option value="${esc(v)}">${esc(v)}</option>`)
              .join("");
          if (values.includes(cur)) sel.value = cur;
        }
        function uniq(field) {
          return [...new Set(state.bets.map((b) => b[field] || "—"))].sort();
        }
        function renderOptions() {
          fillSelect($("fSport"), uniq("sport"), "All sports");
          fillSelect($("fBook"), uniq("book"), "All books");
          const defaults = {
            book: [
              "DraftKings",
              "FanDuel",
              "BetMGM",
              "Caesars",
              "ESPN Bet",
              "bet365",
              "Fanatics",
            ],
          };
          $("bookList").innerHTML = [
            ...new Set([
              ...uniq("book").filter((v) => v !== "—"),
              ...defaults.book,
            ]),
          ]
            .map((v) => `<option value="${esc(v)}">`)
            .join("");
        }

        function renderSortHeaders() {
          document.querySelectorAll("th.sortable").forEach((th) => {
            const base = th.textContent.replace(/ [▲▼]$/, "");
            th.textContent =
              base +
              (th.dataset.sort === sortKey ? (sortDir > 0 ? " ▲" : " ▼") : "");
          });
        }

        function render() {
          renderOptions();
          const list = filtered();
          renderStats(list);
          renderChart(list);
          renderBreakdown(list);
          renderRows(list);
          renderSortHeaders();
        }

        // ---------- dialog ----------
        let editingId = null;
        const dlg = $("dlg");

        function openDialog(bet) {
          editingId = bet ? bet.id : null;
          $("dlgTitle").textContent = bet ? "Edit bet" : "Add bet";
          $("bDate").value = bet ? bet.date : todayStr();
          let sport = bet ? bet.sport || "Other" : "NFL";
          if (!bet && state.bets.length) {
            const last = [...state.bets].sort(
              (a, b) => (b.created || 0) - (a.created || 0),
            )[0];
            sport = last.sport || sport;
          }
          fillSports(sport);
          fillMarkets(bet ? bet.type : null);
          $("bEvent").value = bet ? bet.event : "";
          $("bPick").value = bet ? bet.pick || "" : "";
          $("bPlayer").value = bet ? bet.player || "" : "";
          $("bLine").value = bet && bet.line != null ? bet.line : "";
          updateMarketFields(bet ? bet.side : null);
          $("bBook").value = bet ? bet.book || "" : "";
          $("bOdds").value = bet ? bet.oddsInput || toAmerican(bet.odds) : "";
          $("bStake").value = bet ? bet.stake : "";
          $("bStatus").value = bet ? bet.status : "pending";
          $("bCashout").value = bet && bet.cashout != null ? bet.cashout : "";
          $("bNotes").value = bet ? bet.notes || "" : "";
          if (!bet && state.bets.length) {
            // prefill sport/book from most recent bet for faster entry
            const last = [...state.bets].sort(
              (a, b) => (b.created || 0) - (a.created || 0),
            )[0];
            $("bBook").value = last.book || "";
          }
          updatePreview();
          dlg.showModal();
          $("bEvent").focus();
        }
        function fillSports(current) {
          const names = SPORTS.map(([n]) => n);
          if (current && !names.includes(current)) names.splice(-1, 0, current);
          $("bSport").innerHTML = names
            .map((n) => `<option value="${esc(n)}">${esc(n)}</option>`)
            .join("");
          $("bSport").value = current || "NFL";
        }
        function fillMarkets(current) {
          const groups = marketsFor($("bSport").value);
          const known = groups.some(([, l]) => l.some(([n]) => n === current));
          $("bType").innerHTML =
            (current && !known
              ? `<option value="${esc(current)}">${esc(current)}</option>`
              : "") +
            groups
              .map(
                ([label, list]) =>
                  `<optgroup label="${label}">${list
                    .map(
                      ([n]) => `<option value="${esc(n)}">${esc(n)}</option>`,
                    )
                    .join("")}</optgroup>`,
              )
              .join("");
          const prev = $("bType").dataset.prev;
          const all = groups.flatMap(([, l]) => l.map(([n]) => n));
          $("bType").value = current || (all.includes(prev) ? prev : all[0]);
        }
        function updateMarketFields(side) {
          const kind = kindOf($("bSport").value, $("bType").value);
          $("bType").dataset.prev = $("bType").value;
          const isProp = kind === "ou" || kind === "yn";
          $("playerWrap").classList.toggle("hidden", !isProp);
          const sides =
            kind === "ou" || kind === "total"
              ? ["Over", "Under"]
              : kind === "yn"
                ? ["Yes", "No"]
                : null;
          $("sideWrap").classList.toggle("hidden", !sides);
          if (sides) {
            const cur = side || $("bSide").value;
            $("bSide").innerHTML = sides
              .map((v) => `<option>${v}</option>`)
              .join("");
            if (sides.includes(cur)) $("bSide").value = cur;
          }
          const hasLine =
            kind === "ou" || kind === "total" || kind === "spread";
          $("lineWrap").classList.toggle("hidden", !hasLine);
          $("lineLabel").textContent = kind === "spread" ? "Spread" : "Line";
          $("bLine").placeholder =
            kind === "spread"
              ? "e.g. -3.5"
              : kind === "ou"
                ? "e.g. 274.5"
                : "e.g. 47.5";
          const pickCfg = {
            ml: ["Team / Side", "e.g. Chiefs"],
            spread: ["Team", "e.g. Chiefs"],
            total: ["Details (optional)", "e.g. team name for a team total"],
            ou: ["Details (optional)", ""],
            yn: ["Details (optional)", ""],
            pick: ["Selection", "e.g. legs of the parlay, outcome, etc."],
          }[kind];
          $("pickLabel").textContent = pickCfg[0];
          $("bPick").placeholder = pickCfg[1];
          // grid: put side + line on one row; full-width when only one shows
          $("sideWrap").classList.toggle("full", sides && !hasLine);
          $("lineWrap").classList.toggle("full", hasLine && !sides);
          // suggest players already used in this sport
          const players = [
            ...new Set(
              state.bets
                .filter((b) => b.player && b.sport === $("bSport").value)
                .map((b) => b.player),
            ),
          ].sort();
          $("playerList").innerHTML = players
            .map((n) => `<option value="${esc(n)}">`)
            .join("");
        }
        $("bSport").addEventListener("change", () => {
          fillMarkets(null);
          updateMarketFields();
        });
        $("bType").addEventListener("change", () => updateMarketFields());

        function closeDialog() {
          dlg.close();
          editingId = null;
        }

        function updatePreview() {
          const status = $("bStatus").value;
          $("cashoutWrap").classList.toggle("hidden", status !== "cashout");
          const dec = parseOdds($("bOdds").value);
          const stake = Number($("bStake").value);
          const hint = $("oddsHint");
          if ($("bOdds").value.trim() && !dec) {
            hint.textContent = "Invalid odds — use -110, +150 or 2.50";
            hint.style.color = "var(--loss)";
          } else if (dec) {
            hint.textContent = `${toAmerican(dec)} · ${dec.toFixed(3)} dec · implied ${(100 / dec).toFixed(1)}%`;
            hint.style.color = "";
          } else {
            hint.textContent = "American or decimal";
            hint.style.color = "";
          }
          if (dec && stake > 0) {
            const win = stake * (dec - 1);
            $("preview").innerHTML =
              `To win <b>${esc(fmtMoney(win))}</b> · payout <b>${esc(fmtMoney(stake + win))}</b>`;
          } else {
            $("preview").textContent = "";
          }
        }

        $("betForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const dec = parseOdds($("bOdds").value);
          const stake = Number($("bStake").value);
          if (!dec) {
            $("bOdds").focus();
            toast("Enter valid odds");
            return;
          }
          if (!(stake > 0)) {
            $("bStake").focus();
            toast("Enter a stake greater than 0");
            return;
          }
          const status = $("bStatus").value;
          const sport = $("bSport").value;
          const type = $("bType").value;
          const kind = kindOf(sport, type);
          const isProp = kind === "ou" || kind === "yn";
          const hasLine =
            kind === "ou" || kind === "total" || kind === "spread";
          const hasSide = kind === "ou" || kind === "total" || kind === "yn";
          if (isProp && !$("bPlayer").value.trim()) {
            $("bPlayer").focus();
            toast("Enter the player");
            return;
          }
          const lineVal = $("bLine").value.trim();
          if (kind === "ou" && lineVal === "") {
            $("bLine").focus();
            toast("Enter the line");
            return;
          }
          const data = {
            date: $("bDate").value || todayStr(),
            sport,
            event: $("bEvent").value.trim(),
            pick: $("bPick").value.trim(),
            type,
            kind,
            player: isProp ? $("bPlayer").value.trim() : "",
            side: hasSide ? $("bSide").value : "",
            line: hasLine && lineVal !== "" ? Number(lineVal) : null,
            book: $("bBook").value.trim(),
            odds: dec,
            oddsInput: $("bOdds").value.trim(),
            stake,
            status,
            cashout:
              status === "cashout" ? Number($("bCashout").value) || 0 : null,
            notes: $("bNotes").value.trim(),
          };
          if (editingId) {
            const i = state.bets.findIndex((b) => b.id === editingId);
            if (i >= 0) state.bets[i] = { ...state.bets[i], ...data };
            toast("Bet updated");
          } else {
            state.bets.push({ id: uid(), created: Date.now(), ...data });
            toast("Bet added");
          }
          save();
          closeDialog();
          render();
        });

        ["bOdds", "bStake", "bStatus"].forEach((id) =>
          $(id).addEventListener("input", updatePreview),
        );
        $("closeDlg").addEventListener("click", closeDialog);
        $("cancelDlg").addEventListener("click", closeDialog);
        $("addBtn").addEventListener("click", () => openDialog(null));

        // ---------- table actions ----------
        $("rows").addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-act]");
          if (!btn) return;
          const bet = state.bets.find((b) => b.id === btn.dataset.id);
          if (!bet) return;
          const act = btn.dataset.act;
          if (act === "edit") openDialog(bet);
          else if (act === "del") {
            if (confirm(`Delete "${bet.event}"?`)) {
              state.bets = state.bets.filter((b) => b.id !== bet.id);
              save();
              render();
              toast("Bet deleted");
            }
          } else if (act === "won" || act === "lost") {
            bet.status = act;
            save();
            render();
            toast(act === "won" ? "Nice! Marked as won" : "Marked as lost");
          }
        });

        document.querySelectorAll("th.sortable").forEach((th) =>
          th.addEventListener("click", () => {
            const k = th.dataset.sort;
            if (sortKey === k) sortDir = -sortDir;
            else {
              sortKey = k;
              sortDir =
                k === "date" || k === "profit" || k === "stake" ? -1 : 1;
            }
            render();
          }),
        );

        $("breakdownTabs").addEventListener("click", (e) => {
          const b = e.target.closest("button[data-key]");
          if (!b) return;
          breakdownKey = b.dataset.key;
          document
            .querySelectorAll("#breakdownTabs button")
            .forEach((x) => x.setAttribute("aria-selected", String(x === b)));
          renderBreakdown(filtered());
        });

        ["fSearch", "fStatus", "fSport", "fBook", "fRange"].forEach((id) =>
          $(id).addEventListener("input", render),
        );

        $("bankroll").value = state.bankroll || "";
        $("bankroll").addEventListener("input", () => {
          state.bankroll = Number($("bankroll").value) || 0;
          save();
          const list = filtered();
          renderStats(list);
          renderChart(list);
        });

        // ---------- theme ----------
        function applyTheme() {
          if (state.theme)
            document.documentElement.setAttribute("data-theme", state.theme);
          else document.documentElement.removeAttribute("data-theme");
          $("themeBtn").textContent = isDark() ? "Light mode" : "Dark mode";
        }
        function isDark() {
          return (
            state.theme === "dark" ||
            (!state.theme && matchMedia("(prefers-color-scheme: dark)").matches)
          );
        }
        $("themeBtn").addEventListener("click", () => {
          state.theme = isDark() ? "light" : "dark";
          applyTheme();
          save();
          render();
        });
        applyTheme();

        // ---------- import / export ----------
        function download(name, text, type) {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([text], { type }));
          a.download = name;
          document.body.appendChild(a);
          a.click();
          setTimeout(() => {
            URL.revokeObjectURL(a.href);
            a.remove();
          }, 0);
        }
        $("exportJsonBtn").addEventListener("click", () => {
          download(
            `jmbets-backup-${todayStr()}.json`,
            JSON.stringify(
              { bets: state.bets, bankroll: state.bankroll },
              null,
              2,
            ),
            "application/json",
          );
        });
        $("exportCsvBtn").addEventListener("click", () => {
          const cols = [
            "date",
            "sport",
            "event",
            "bet",
            "player",
            "side",
            "line",
            "pick",
            "description",
            "book",
            "odds_american",
            "odds_decimal",
            "stake",
            "status",
            "profit",
            "notes",
          ];
          const q = (v) => {
            const s = String(v ?? "");
            return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
          };
          const lines = [cols.join(",")].concat(
            sorted(filtered()).map((b) =>
              [
                b.date,
                b.sport,
                b.event,
                b.type,
                b.player,
                b.side,
                b.line,
                b.pick,
                describe(b),
                b.book,
                toAmerican(b.odds),
                b.odds.toFixed(3),
                b.stake.toFixed(2),
                b.status,
                isSettled(b) ? profitOf(b).toFixed(2) : "",
                b.notes,
              ]
                .map(q)
                .join(","),
            ),
          );
          download(`jmbets-${todayStr()}.csv`, lines.join("\n"), "text/csv");
        });
        $("importBtn").addEventListener("click", () => $("importFile").click());
        $("importFile").addEventListener("change", async (e) => {
          const file = e.target.files[0];
          e.target.value = "";
          if (!file) return;
          try {
            const d = JSON.parse(await file.text());
            const bets = (Array.isArray(d) ? d : d.bets || []).filter(
              (b) =>
                b &&
                typeof b.event === "string" &&
                Number(b.odds) > 1 &&
                Number(b.stake) > 0,
            );
            if (!bets.length) throw new Error("no bets");
            const replace = confirm(
              `Found ${bets.length} bets.\n\nOK = replace your current ${state.bets.length} bets\nCancel = merge them in`,
            );
            const norm = bets.map((b) => ({
              ...b,
              id: b.id || uid(),
              odds: Number(b.odds),
              stake: Number(b.stake),
              status: b.status || "pending",
            }));
            if (replace) state.bets = norm;
            else {
              const ids = new Set(state.bets.map((b) => b.id));
              state.bets.push(...norm.filter((b) => !ids.has(b.id)));
            }
            if (!Array.isArray(d) && d.bankroll != null && replace) {
              state.bankroll = Number(d.bankroll) || 0;
              $("bankroll").value = state.bankroll || "";
            }
            save();
            render();
            toast(`Imported ${bets.length} bets`);
          } catch (err) {
            toast("Couldn't read that file — use a Backup .json");
          }
        });

        // ---------- misc ----------
        let toastTimer;
        function toast(msg) {
          const t = $("toast");
          t.textContent = msg;
          t.classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
        }

        document.addEventListener("keydown", (e) => {
          if (
            e.key === "n" &&
            !dlg.open &&
            !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)
          ) {
            e.preventDefault();
            openDialog(null);
          }
        });

        render();
      })();
    </script>
  </body>
</html>
